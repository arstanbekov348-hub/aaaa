<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProgressMe Live — Онлайн Платформа</title>
  <!-- Firebase для реального онлайна и синхронизации -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root {
      --primary: #10b981;
      --primary-hover: #059669;
      --bg: #f3f4f6;
      --text: #1f2937;
      --border: #e5e7eb;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Экран входа */
    .login-box {
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 380px;
      margin: 100px auto;
      animation: fadeIn 0.3s ease-out;
    }

    .app-viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.3s ease-out;
    }

    /* Шапка */
    .header {
      background: white;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .online-badge {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .green-dot {
      width: 9px;
      height: 9px;
      background-color: var(--primary);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    /* Основной макет */
    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 270px;
      background: #f9fafb;
      border-right: 1px solid var(--border);
      padding: 15px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
    }

    .tab-item {
      padding: 12px 16px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: #4b5563;
      text-align: left;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-item:hover { background: #e5e7eb; color: var(--text); }
    .tab-item.active { background: var(--primary); color: white; box-shadow: 0 2px 5px rgba(16,185,129,0.3); }

    .content-area {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
      background: white;
    }

    .tab-panel { display: none; height: 100%; flex-direction: column; animation: fadeIn 0.2s ease-out; }
    .tab-panel.active { display: flex; }

    input, select, button {
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin: 5px 0;
      font-size: 14px;
      box-sizing: border-box;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover { background: var(--primary-hover); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }

    .users-list-popup {
      position: absolute;
      top: 60px;
      right: 20px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      z-index: 100;
      width: 300px;
      animation: fadeIn 0.2s ease-out;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ФОРМА ВХОДА -->
  <div id="login-screen" class="login-box">
    <h3 style="margin-top:0; text-align:center;">Вход в ProgressMe</h3>
    <label style="font-size:12px; font-weight:600;">Роль в системе:</label>
    <select id="role-select" style="width:100%;">
      <option value="admin">Администратор</option>
      <option value="teacher">Учитель</option>
      <option value="student">Ученик</option>
    </select>

    <label style="font-size:12px; font-weight:600;">Логин:</label>
    <input type="text" id="username" placeholder="Ваш логин..." style="width:100%;">
    
    <label style="font-size:12px; font-weight:600;">Пароль:</label>
    <input type="password" id="password" placeholder="Пароль..." style="width:100%;">
    
    <button onclick="login()" style="width:100%; margin-top:12px;">Войти в класс</button>
    <div id="error-msg" style="color:#ef4444; font-size:13px; margin-top:10px; text-align:center;"></div>
  </div>

  <!-- ОНЛАЙН КАБИНЕТ -->
  <div id="main-dashboard" class="app-viewport hidden">
    <!-- Шапка -->
    <div class="header">
      <div style="display:flex; align-items:center; gap:10px;">
        <h4 id="user-display" style="margin:0;">Пользователь</h4>
        <span id="role-tag" style="background:#e0e7ff; color:#3730a3; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600;"></span>
      </div>

      <div style="display:flex; align-items:center; gap:12px;">
        <!-- Индикатор онлайн -->
        <div class="online-badge">
          <span class="green-dot"></span>
          <span>Онлайн: <b id="online-count">1</b> чел.</span>
        </div>

        <!-- Кнопка участников и админ-панели -->
        <button onclick="toggleUsersPopup()" style="background:#f3f4f6; color:#374151; padding:7px 14px;" title="Список участников и админка">👤 Участники</button>
        <button class="btn-danger" onclick="logout()" style="padding:7px 14px;">Выйти</button>
      </div>
    </div>

    <!-- Всплывающее окно (Список онлайн + Создание юзеров и вкладок для Админа) -->
    <div id="users-popup" class="users-list-popup hidden">
      <h5 style="margin:0 0 8px 0; color:#111827;">Сейчас в онлайн-классе:</h5>
      <ul id="online-users-list" style="padding-left:18px; margin:0 0 15px 0; font-size:13px; color:#059669;"></ul>

      <div id="admin-tools" class="hidden" style="border-top:1px solid var(--border); padding-top:12px;">
        <h5 style="margin:0 0 6px 0; color:#111827;">Создать пользователя:</h5>
        <select id="new-role" style="width:100%;"><option value="teacher">Учитель</option><option value="student">Ученик</option></select>
        <input type="text" id="new-user" placeholder="Логин" style="width:100%;">
        <input type="password" id="new-pass" placeholder="Пароль" style="width:100%;">
        <button onclick="createUser()" style="width:100%; margin-bottom:12px;">Создать аккаунт</button>

        <h5 style="margin:0 0 6px 0; color:#111827;">Создать новую вкладку:</h5>
        <input type="text" id="new-tab-name" placeholder="Название вкладки" style="width:100%;">
        <select id="new-tab-type" style="width:100%;">
          <option value="grades">Оценочный журнал</option>
          <option value="media">Книжный / Медиа (Видео/Картинка)</option>
          <option value="chat">Интерактивный чат</option>
        </select>
        <button onclick="createTab()" style="width:100%;">Добавить вкладку</button>
      </div>
    </div>

    <!-- Основная рабочая область -->
    <div class="main-layout">
      <!-- Динамический список вкладок слева -->
      <div class="sidebar" id="sidebar-tabs"></div>

      <!-- Контент справа -->
      <div class="content-area" id="tabs-contents"></div>
    </div>
  </div>

<script>
  // Бесплатная облачная база данных Firebase для реального онлайна
  const firebaseConfig = {
    databaseURL: "https://progressme-free-default-rtdb.firebaseio.com/"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const ADMIN_U = "aigerim1992";
  const ADMIN_P = "14061992";

  let currentUser = null;
  let currentRole = null;
  let activeTabId = null;

  function login() {
    const role = document.getElementById("role-select").value;
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();
    const err = document.getElementById("error-msg");
    err.textContent = "";

    if (role === "admin") {
      if (user === ADMIN_U && pass === ADMIN_P) {
        startSession("admin", user);
      } else { err.textContent = "Неверный логин или пароль администратора!"; }
      return;
    }

    db.ref('users/' + user).once('value', snapshot => {
      const data = snapshot.val();
      if (data && data.password === pass && data.role === role) {
        startSession(role, user);
      } else {
        err.textContent = "Пользователь не найден или неверный пароль!";
      }
    });
  }

  function startSession(role, username) {
    currentUser = username;
    currentRole = role;

    document.getElementById("login-screen").classList.add("hidden");
    document.getElementById("main-dashboard").classList.remove("hidden");
    document.getElementById("user-display").textContent = username;
    document.getElementById("role-tag").textContent = role === 'admin' ? 'Администратор' : role === 'teacher' ? 'Учитель' : 'Ученик';

    if (role === 'admin') {
      document.getElementById("admin-tools").classList.remove("hidden");
    }

    // Регистрация в списке ОНЛАЙН (удаляется при закрытии вкладки)
    const presenceRef = db.ref('presence/' + username);
    presenceRef.set({ username: username, role: role });
    presenceRef.onDisconnect().remove();

    initRealtimeSync();
  }

  // Синхронизация данных в реальном времени
  function initRealtimeSync() {
    // 1. Кто онлайн
    db.ref('presence').on('value', snapshot => {
      const users = snapshot.val() || {};
      const listEl = document.getElementById("online-users-list");
      listEl.innerHTML = "";
      let count = 0;
      for (let u in users) {
        count++;
        let li = document.createElement("li");
        li.textContent = `${users[u].username} (${users[u].role === 'admin' ? 'Админ' : users[u].role === 'teacher' ? 'Учитель' : 'Ученик'})`;
        listEl.appendChild(li);
      }
      document.getElementById("online-count").textContent = count;
    });

    // 2. Вкладки (автосоздание стандартных, если их нет)
    db.ref('tabs').once('value', snapshot => {
      if (!snapshot.exists()) {
        db.ref('tabs').set({
          "tab_1": { name: "📊 Оценки класса", type: "grades", grades: {} },
          "tab_2": { name: "📚 Учебные материалы", type: "media", url: "" },
          "tab_3": { name: "💬 Общий чат", type: "chat", messages: {} }
        });
      }
    });

    db.ref('tabs').on('value', snapshot => {
      renderTabs(snapshot.val() || {});
    });
  }

  // Отрисовка вкладок слева и контента справа
  function renderTabs(tabs) {
    const sidebar = document.getElementById("sidebar-tabs");
    const contents = document.getElementById("tabs-contents");
    sidebar.innerHTML = "";
    contents.innerHTML = "";

    let firstId = null;
    let keys = Object.keys(tabs);

    if (keys.length > 0 && !activeTabId) {
      activeTabId = keys[0];
    }

    keys.forEach(id => {
      let tab = tabs[id];
      if (!firstId) firstId = id;

      // Кнопка в сайдбаре
      let btn = document.createElement("button");
      btn.className = `tab-item ${activeTabId === id ? 'active' : ''}`;
      btn.textContent = tab.name;
      btn.onclick = () => {
        activeTabId = id;
        renderTabs(tabs);
      };
      sidebar.appendChild(btn);

      // Контент вкладки
      let panel = document.createElement("div");
      panel.className = `tab-panel ${activeTabId === id ? 'active' : ''}`;
      
      let deleteBtnHtml = (currentRole === 'admin') ? `<button onclick="deleteTab('${id}')" class="btn-danger" style="width:auto; padding:6px 12px; font-size:12px; margin-bottom:15px;">Удалить эту вкладку</button>` : '';

      if (tab.type === 'grades') {
        db.ref('users').once('value', uSnap => {
          let students = [];
          let uData = uSnap.val() || {};
          for (let u in uData) {
            if (uData[u].role === 'student') students.push(u);
          }

          let gradesData = tab.grades || {};
          let rows = students.map(s => `
            <tr style="border-bottom: 1px solid var(--border);">
              <td style="padding:12px;">${s}</td>
              <td style="padding:12px;"><b>${gradesData[s] || 'Нет оценки'}</b></td>
              ${(currentRole === 'teacher' || currentRole === 'admin') ? `
                <td style="padding:12px; display:flex; gap:8px; align-items:center;">
                  <input type="text" id="g_${id}_${s}" placeholder="Оценка" style="width:90px; margin:0;">
                  <button onclick="saveGrade('${id}', '${s}')" style="width:auto; padding:8px 12px; margin:0;">Поставить</button>
                </td>` : ''}
            </tr>
          `).join('');

          panel.innerHTML = `
            ${deleteBtnHtml}
            <h3 style="margin-top:0;">${tab.name}</h3>
            <table style="width:100%; border-collapse:collapse; background:white; border:1px solid var(--border); border-radius:8px; overflow:hidden;">
              <tr style="background:#f9fafb; text-align:left; border-bottom:1px solid var(--border);">
                <th style="padding:12px;">Ученик</th>
                <th style="padding:12px;">Оценка</th>
                ${(currentRole === 'teacher' || currentRole === 'admin') ? '<th style="padding:12px;">Действие</th>' : ''}
              </tr>
              ${students.length ? rows : '<tr><td colspan="3" style="padding:20px; text-align:center; color:#6b7280;">Нет учеников. Администратор может создать их через кнопку «👤 Участники».</td></tr>'}
            </table>
          `;
        });
      } 
      else if (tab.type === 'media') {
        panel.innerHTML = `
          ${deleteBtnHtml}
          <h3 style="margin-top:0;">${tab.name}</h3>
          ${(currentRole === 'admin' || currentRole === 'teacher') ? `
            <div style="background:#f9fafb; padding:15px; border-radius:8px; border:1px solid var(--border); margin-bottom:15px;">
              <label style="font-size:13px; font-weight:600;">Ссылка на видео (YouTube / Embed) или картинку:</label>
              <input type="text" id="media_url_${id}" placeholder="Вставьте ссылку..." value="${tab.url || ''}" style="width:100%;">
              <button onclick="saveMedia('${id}')" style="width:auto;">Обновить для всех</button>
            </div>
          ` : ''}
          <div style="flex:1; border:1px solid var(--border); border-radius:8px; background:#000; overflow:hidden; min-height:400px; display:flex; align-items:center; justify-content:center;">
            ${tab.url ? `<iframe src="${tab.url}" width="100%" height="100%" style="border:none;"></iframe>` : '<span style="color:#9ca3af;">Материал не выбран преподавателем</span>'}
          </div>
        `;
      } 
      else if (tab.type === 'chat') {
        let msgs = tab.messages || {};
        let chatHtml = Object.values(msgs).map(m => `
          <div style="margin-bottom:10px; padding:10px 14px; background:#f9fafb; border-radius:8px; border-left:4px solid var(--primary);">
            <strong style="color:#111827;">${m.user}</strong>:
            <div style="margin-top:4px; color:#374151;">${m.text}</div>
          </div>
        `).join('');

        panel.innerHTML = `
          ${deleteBtnHtml}
          <h3 style="margin-top:0;">${tab.name}</h3>
          <div style="border:1px solid var(--border); background:#ffffff; flex:1; min-height:250px; max-height:55vh; overflow-y:auto; padding:15px; border-radius:8px; margin-bottom:12px;" id="chat_box_${id}">
            ${chatHtml || '<span style="color:#9ca3af;">Сообщений пока нет...</span>'}
          </div>
          <div style="display:flex; gap:10px;">
            <input type="text" id="chat_input_${id}" placeholder="Напишите сообщение..." style="flex:1; margin:0;" onkeypress="if(event.key==='Enter') sendMessage('${id}')">
            <button onclick="sendMessage('${id}')" style="width:130px; margin:0;">Отправить</button>
          </div>
        `;
        setTimeout(() => {
          let box = document.getElementById(`chat_box_${id}`);
          if (box) box.scrollTop = box.scrollHeight;
        }, 50);
      }

      contents.appendChild(panel);
    });
  }

  // Действия администратора и пользователей
  function createUser() {
    let u = document.getElementById("new-user").value.trim();
    let p = document.getElementById("new-pass").value.trim();
    let r = document.getElementById("new-role").value;
    if (!u || !p) return alert("Заполните все поля!");

    db.ref('users/' + u).set({ password: p, role: r }, () => {
      alert("Пользователь успешно создан!");
      document.getElementById("new-user").value = "";
      document.getElementById("new-pass").value = "";
    });
  }

  function createTab() {
    let name = document.getElementById("new-tab-name").value.trim();
    let type = document.getElementById("new-tab-type").value;
    if (!name) return alert("Введите название вкладки!");

    let newId = "tab_" + Date.now();
    let tabData = { name: name, type: type };
    if (type === 'grades') tabData.grades = {};
    if (type === 'media') tabData.url = "";
    if (type === 'chat') tabData.messages = {};

    db.ref('tabs/' + newId).set(tabData, () => {
      document.getElementById("new-tab-name").value = "";
      activeTabId = newId;
    });
  }

  function deleteTab(id) {
    if (!confirm("Удалить эту вкладку?")) return;
    db.ref('tabs/' + id).remove(() => {
      activeTabId = null;
    });
  }

  function saveGrade(tabId, studentName) {
    let val = document.getElementById(`g_${tabId}_${studentName}`).value;
    db.ref(`tabs/${tabId}/grades/${studentName}`).set(val);
  }

  function saveMedia(tabId) {
    let url = document.getElementById(`media_url_${tabId}`).value.trim();
    db.ref(`tabs/${tabId}/url`).set(url);
  }

  function sendMessage(tabId) {
    let input = document.getElementById(`chat_input_${tabId}`);
    if (!input.value.trim()) return;
    db.ref(`tabs/${tabId}/messages`).push({
      user: currentUser,
      text: input.value.trim()
    });
    input.value = "";
  }

  function toggleUsersPopup() {
    document.getElementById("users-popup").classList.toggle("hidden");
  }

  function logout() {
    if (currentUser) db.ref('presence/' + currentUser).remove();
    location.reload();
  }
</script>

</body>
</html>
