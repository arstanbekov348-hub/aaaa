<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Учебная Платформа</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
    
    /* Окно входа (посередине) */
    .card-login { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    
    /* Большое рабочее окно на весь экран */
    .card-app { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 95vw; height: 90vh; display: flex; flex-direction: column; box-sizing: border-box; }
    
    h2, h3 { text-align: center; color: #333; margin-top: 0; }
    select, input, button, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { background-color: #4CAF50; color: white; font-weight: bold; cursor: pointer; border: none; }
    button:hover { background-color: #45a049; }
    .hidden { display: none; }
    .error { color: red; text-align: center; font-size: 14px; }
    .logout-btn { background-color: #f44336; margin-top: auto; }
    
    /* Верхняя панель */
    .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
    .admin-icon-btn { background: none; border: none; font-size: 24px; cursor: pointer; width: auto; padding: 5px 10px; }
    .admin-icon-btn:hover { background: #eee; border-radius: 5px; }

    /* Основной макет: слева вкладки, справа контент */
    .app-body { display: flex; flex: 1; gap: 20px; overflow: hidden; }
    
    /* Левая колонка с вкладками */
    .sidebar-tabs { width: 250px; display: flex; flex-direction: column; gap: 5px; border-right: 1px solid #eee; padding-right: 15px; overflow-y: auto; }
    .tab-btn { padding: 10px 15px; background: #f1f1f1; border: none; cursor: pointer; border-radius: 5px; text-align: left; width: 100%; font-weight: normal; color: #333; }
    .tab-btn.active { background: #4CAF50; color: white; font-weight: bold; }
    
    /* Правая колонка с содержимым вкладки */
    .content-area { flex: 1; overflow-y: auto; padding-left: 5px; display: flex; flex-direction: column; }
    .tab-content { display: none; height: 100%; flex-direction: column; }
    .tab-content.active { display: flex; }
    
    /* Модальное окно админа */
    .modal { background: #f9f9f9; border: 1px solid #ccc; padding: 15px; border-radius: 5px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <!-- Форма входа -->
  <div id="login-screen" class="card-login">
    <h2>Вход в систему</h2>
    <label>Выберите роль:</label>
    <select id="role-select">
      <option value="admin">Администратор</option>
      <option value="teacher">Учитель</option>
      <option value="student">Ученик</option>
    </select>

    <input type="text" id="username" placeholder="Логин">
    <input type="password" id="password" placeholder="Пароль">
    <button onclick="login()">Войти</button>
    <div id="error-msg" class="error"></div>
  </div>

  <!-- Главный кабинет (большой, на весь экран) -->
  <div id="main-dashboard" class="card-app hidden">
    <div class="top-bar">
      <div>
        <h3 id="welcome-title" style="margin:0; text-align: left;">Кабинет</h3>
        <small id="role-subtitle" style="color: gray;"></small>
      </div>
      <!-- Кнопка управления пользователями (сверху справа) -->
      <button id="admin-panel-btn" class="admin-icon-btn hidden" onclick="toggleAdminPanel()" title="Управление пользователями">👤</button>
    </div>

    <!-- Панель админа (скрытая) -->
    <div id="admin-user-manager" class="modal hidden">
      <h4>Управление пользователями</h4>
      <select id="new-user-role">
        <option value="teacher">Учитель</option>
        <option value="student">Ученик</option>
      </select>
      <input type="text" id="new-username" placeholder="Логин пользователя">
      <input type="password" id="new-password" placeholder="Пароль пользователя">
      <button onclick="createUser()">Создать пользователя</button>
      <div id="admin-msg" style="color: green; text-align: center; font-size: 14px;"></div>
      
      <h4 style="margin-top: 15px;">Создать новую вкладку</h4>
      <input type="text" id="tab-name" placeholder="Название вкладки">
      <label style="font-size: 13px;">Тип вкладки:</label>
      <select id="tab-type">
        <option value="grades">Оценочный (учитель ставит оценки)</option>
        <option value="media">Книжный / Медиа (ссылки на фото/видео)</option>
        <option value="chat">Чатный (общение)</option>
      </select>
      <button onclick="createTab()">Создать вкладку</button>
    </div>

    <!-- Основной макет: слева вкладки, справа контент -->
    <div class="app-body">
      <div class="sidebar-tabs" id="tabs-header"></div>
      <div class="content-area" id="tabs-contents"></div>
    </div>

    <button class="logout-btn" onclick="logout()" style="max-width: 200px;">Выйти из системы</button>
  </div>

<script>
  const ADMIN_USER = "aigerim1992";
  const ADMIN_PASS = "14061992";

  if (!localStorage.getItem("users")) localStorage.setItem("users", JSON.stringify([]));
  if (!localStorage.getItem("tabs")) {
    localStorage.setItem("tabs", JSON.stringify([
      { id: "tab_1", name: "Оценки класса", type: "grades", grades: {} },
      { id: "tab_2", name: "Видео и Книги", type: "media", url: "" },
      { id: "tab_3", name: "Общий чат", type: "chat", messages: [] }
    ]));
  }

  let currentUser = null;
  let currentRole = null;

  function login() {
    const role = document.getElementById("role-select").value;
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();
    const error = document.getElementById("error-msg");
    error.textContent = "";

    if (role === "admin") {
      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        setSession("admin", user);
      } else {
        error.textContent = "Неверный логин или пароль администратора";
      }
      return;
    }

    const users = JSON.parse(localStorage.getItem("users"));
    const foundUser = users.find(u => u.username === user && u.password === pass && u.role === role);

    if (foundUser) {
      setSession(role, foundUser.username);
    } else {
      error.textContent = "Пользователь не найден или данные не верны";
    }
  }

  function setSession(role, username) {
    currentRole = role;
    currentUser = username;
    document.getElementById("login-screen").classList.add("hidden");
    document.getElementById("main-dashboard").classList.remove("hidden");
    
    document.getElementById("welcome-title").textContent = username;
    document.getElementById("role-subtitle").textContent = role === 'admin' ? 'Администратор' : role === 'teacher' ? 'Учитель' : 'Ученик';

    if (role === "admin") {
      document.getElementById("admin-panel-btn").classList.remove("hidden");
    } else {
      document.getElementById("admin-panel-btn").classList.add("hidden");
      document.getElementById("admin-user-manager").classList.add("hidden");
    }

    renderTabs();
  }

  function toggleAdminPanel() {
    document.getElementById("admin-user-manager").classList.toggle("hidden");
  }

  function createUser() {
    const role = document.getElementById("new-user-role").value;
    const user = document.getElementById("new-username").value.trim();
    const pass = document.getElementById("new-password").value.trim();
    const msg = document.getElementById("admin-msg");

    if (!user || !pass) { alert("Заполните все поля!"); return; }

    const users = JSON.parse(localStorage.getItem("users"));
    if (users.some(u => u.username === user)) { alert("Логин уже занят!"); return; }

    users.push({ username: user, password: pass, role: role });
    localStorage.setItem("users", JSON.stringify(users));

    msg.textContent = `Создан ${role === 'teacher' ? 'Учитель' : 'Ученик'}: ${user}`;
    document.getElementById("new-username").value = "";
    document.getElementById("new-password").value = "";
  }

  function createTab() {
    const name = document.getElementById("tab-name").value.trim();
    const type = document.getElementById("tab-type").value;
    if (!name) { alert("Введите название вкладки!"); return; }

    const tabs = JSON.parse(localStorage.getItem("tabs"));
    const newTab = {
      id: "tab_" + Date.now(),
      name: name,
      type: type,
      grades: {},
      url: "",
      messages: []
    };

    tabs.push(newTab);
    localStorage.setItem("tabs", JSON.stringify(tabs));
    document.getElementById("tab-name").value = "";
    toggleAdminPanel();
    renderTabs();
  }

  function deleteTab(tabId) {
    if (!confirm("Удалить эту вкладку?")) return;
    let tabs = JSON.parse(localStorage.getItem("tabs"));
    tabs = tabs.filter(t => t.id !== tabId);
    localStorage.setItem("tabs", JSON.stringify(tabs));
    renderTabs();
  }

  function renderTabs() {
    const tabsHeader = document.getElementById("tabs-header");
    const tabsContents = document.getElementById("tabs-contents");
    tabsHeader.innerHTML = "";
    tabsContents.innerHTML = "";

    const tabs = JSON.parse(localStorage.getItem("tabs"));

    tabs.forEach((tab, index) => {
      const btn = document.createElement("button");
      btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
      btn.textContent = tab.name;
      btn.onclick = (e) => switchTab(tab.id, e);
      tabsHeader.appendChild(btn);

      const content = document.createElement("div");
      content.className = `tab-content ${index === 0 ? 'active' : ''}`;
      content.id = `content_${tab.id}`;

      let deleteHtml = currentRole === 'admin' ? `<button onclick="deleteTab('${tab.id}')" style="background:#f44336; width:auto; padding:5px 10px; font-size:12px; margin-bottom:10px;">Удалить вкладку</button>` : '';

      if (tab.type === 'grades') {
        let users = JSON.parse(localStorage.getItem("users")).filter(u => u.role === 'student');
        let gradesData = tab.grades || {};

        let rows = users.map(s => `
          <tr>
            <td>${s.username}</td>
            <td><b>${gradesData[s.username] || 'Нет оценки'}</b></td>
            ${currentRole === 'teacher' || currentRole === 'admin' ? `<td><input type="text" id="grade_${tab.id}_${s.username}" placeholder="Оценка" style="width:100px; margin:0;"><button onclick="saveGrade('${tab.id}', '${s.username}')" style="width:auto; padding:5px 10px; margin:0;">Поставить</button></td>` : ''}
          </tr>
        `).join('');

        content.innerHTML = `
          ${deleteHtml}
          <h4>Оценки учеников</h4>
          <table border="1" cellpadding="8" style="width:100%; border-collapse: collapse; background:white;">
            <tr><th>Ученик</th><th>Оценка</th> ${currentRole === 'teacher' || currentRole === 'admin' ? '<th>Действие</th>' : ''}</tr>
            ${users.length ? rows : '<tr><td colspan="3" align="center">Нет зарегистрированных учеников</td></tr>'}
          </table>
        `;
      } 
      else if (tab.type === 'media') {
        content.innerHTML = `
          ${deleteHtml}
          <h4>Медиа-материалы (Видео / Картинки)</h4>
          <p>Текущая ссылка: <a href="${tab.url || '#'}" target="_blank">${tab.url || 'Не задана'}</a></p>
          ${currentRole === 'admin' || currentRole === 'teacher' ? `
            <input type="text" id="media_url_${tab.id}" placeholder="Вставьте ссылку на видео или картинку" value="${tab.url || ''}">
            <button onclick="saveMedia('${tab.id}')">Сохранить ссылку</button>
          ` : ''}
          <div style="margin-top:15px; flex:1;">
            ${tab.url ? `<iframe src="${tab.url}" width="100%" height="100%" style="border:none; min-height:400px;"></iframe><br><img src="${tab.url}" style="max-width:100%; margin-top:10px;" onerror="this.style.display='none'">` : 'Ссылка не указана'}
          </div>
        `;
      } 
      else if (tab.type === 'chat') {
        let messages = tab.messages || [];
        let chatHtml = messages.map(m => `<p style="margin:5px 0;"><b>${m.user} (${m.role}):</b> ${m.text}</p>`).join('');

        content.innerHTML = `
          ${deleteHtml}
          <h4>Чат</h4>
          <div style="border: 1px solid #ccc; background: white; flex:1; min-height:200px; overflow-y: scroll; padding: 10px; margin-bottom: 10px;" id="chat_box_${tab.id}">
            ${chatHtml || '<span style="color:gray;">Сообщений нет...</span>'}
          </div>
          <div style="display: flex; gap: 10px;">
            <input type="text" id="chat_text_${tab.id}" placeholder="Введите сообщение..." style="margin:0;">
            <button onclick="sendMessage('${tab.id}')" style="width: 120px; margin:0;">Отправить</button>
          </div>
        `;
      }

      tabsContents.appendChild(content);
    });
  }

  function switchTab(tabId, event) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(`content_${tabId}`).classList.add('active');
  }

  function saveGrade(tabId, studentName) {
    let val = document.getElementById(`grade_${tabId}_${studentName}`).value;
    let tabs = JSON.parse(localStorage.getItem("tabs"));
    let tab = tabs.find(t => t.id === tabId);
    if (!tab.grades) tab.grades = {};
    tab.grades[studentName] = val;
    localStorage.setItem("tabs", JSON.stringify(tabs));
    renderTabs();
  }

  function saveMedia(tabId) {
    let url = document.getElementById(`media_url_${tabId}`).value;
    let tabs = JSON.parse(localStorage.getItem("tabs"));
    let tab = tabs.find(t => t.id === tabId);
    tab.url = url;
    localStorage.setItem("tabs", JSON.stringify(tabs));
    renderTabs();
  }

  function sendMessage(tabId) {
    let text = document.getElementById(`chat_text_${tabId}`).value.trim();
    if (!text) return;
    let tabs = JSON.parse(localStorage.getItem("tabs"));
    let tab = tabs.find(t => t.id === tabId);
    if (!tab.messages) tab.messages = [];
    tab.messages.push({ user: currentUser, role: currentRole === 'admin' ? 'Админ' : currentRole === 'teacher' ? 'Учитель' : 'Ученик', text: text });
    localStorage.setItem("tabs", JSON.stringify(tabs));
    renderTabs();
  }

  function logout() {
    currentUser = null;
    currentRole = null;
    document.getElementById("main-dashboard").classList.add("hidden");
    document.getElementById("login-screen").classList.remove("hidden");
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
  }
</script>

</body>
</html>
